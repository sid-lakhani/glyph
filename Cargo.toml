[package]
name = "glyph-ocr"
version = "0.1.0"
edition = "2021"
authors = ["Siddhesh Lakhani <sidlakhani@users.noreply.github.com>"]
description = "Blazing-fast, minimal Wayland screen OCR & text sniper"
license = "MIT"
repository = "https://github.com/sid-lakhani/glyph"
keywords = ["wayland", "ocr", "hyprland", "clipboard", "tesseract"]
categories = ["command-line-utilities", "accessibility"]

[[bin]]
name = "glyph"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "cargo"] }

# Logging & Errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"

# Image processing
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }

# Clipboard (Wayland native)
arboard = { version = "3.4", default-features = false, features = ["wayland-data-control"] }

# Notifications
notify-rust = { version = "4.11", default-features = false, features = ["serde", "zbus"] }

# QR code detection & decoding (bonus superpower)
bardecoder = "0.5"

# Optional / Feature-gated OCR backends:
# 1. Tesseract via leptess/tesseract-rs (fast, lightweight, standard)
leptess = { version = "0.14", optional = true }

[features]
default = []
tesseract = ["dep:leptess"]

